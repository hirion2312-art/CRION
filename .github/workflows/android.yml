name: 안드로이드 APK 빌드

# android/ · 화면 엔진 · 작품 목록이 바뀌어 main 에 올라오면 APK 를 만들어 'CRION 안드로이드' 릴리스(미리보기, 태그 android-app)에 올린다
# 실패하면 빌드 오류 줄을 '주석(annotation)'으로 남긴다 (세션이 gh api 로 읽을 수 있게)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/renderer/**'
      - 'config/works.json'
      - 'config/app.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 서명 열쇠 (있으면)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          P1: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P2: ${{ secrets.ANDROID_KEY_PASSWORD }}
          P3: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 값은 보이지 않게, 들어왔는지만 표시
          echo "::notice::비밀값 확인 — KEYSTORE_B64:$([ -n "$KS" ] && echo 있음 || echo 없음) KEYSTORE_PASSWORD:$([ -n "$P1" ] && echo 있음 || echo 없음) KEY_PASSWORD:$([ -n "$P2" ] && echo 있음 || echo 없음) KEY_ALIAS:$([ -n "$P3" ] && echo 있음 || echo 없음)"
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/crion.jks"; echo "CRION_KEYSTORE_FILE=$RUNNER_TEMP/crion.jks" >> "$GITHUB_ENV"; echo "정식 열쇠로 서명"; else echo "::warning::서명 열쇠 비밀값이 없어 시험용(디버그) 열쇠로 서명해요. 이 경우 새 APK를 덮어 설치하지 못하고 지웠다가 다시 설치해야 할 수 있어요."; fi
      - name: APK 만들기
        env:
          CRION_VERSION_CODE: ${{ github.run_number }}
          CRION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CRION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: 오류 줄 남기기
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception|Unresolved|expected|mismatch" -A2 "$RUNNER_TEMP/build.log" | head -45 | while IFS= read -r l; do printf '::error::%s\n' "${l:0:400}"; done
      - name: 시험판 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CRION-android.apk
          # 사이트의 안드로이드 다운로드 링크: releases/download/android-app/CRION-android.apk (미리보기 릴리스라 PC판 '최신'에는 안 섞임)
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --prerelease --title "CRION 안드로이드" --notes "휴대폰(안드로이드)용 CRION 이에요. CRION-android.apk 를 받아 설치하세요. 화면은 앱을 열 때 자동으로 최신이 돼요."
          gh release upload android-app CRION-android.apk --clobber
          echo "빌드 ${{ github.run_number }} · $(date -u +%FT%TZ)" > build-info.txt
          gh release upload android-app build-info.txt --clobber
