name: CRION 빌드 (설치 파일)

# package.json 의 version 을 올려 main 에 올리면 Windows·Mac 설치 파일을 만들고
# GitHub Releases 에 v<버전> 으로 올린다. 다운로드 페이지는 항상 최신 릴리스를 가리킨다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
      exists: ${{ steps.chk.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.v }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    if: needs.version.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: CRION-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: CRION v${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## 설치
            - Windows: `CRION-Setup.exe` 를 받아 실행하면 자동 설치돼요. 파란 경고 창이 뜨면 **추가 정보 → 실행**.
            - Mac: Apple 칩은 `CRION-mac-arm64.dmg`, Intel은 `CRION-mac-x64.dmg`. 처음 열 때 경고가 뜨면 앱을 우클릭 → 열기. "손상되었다"고 뜨면 터미널에 `xattr -cr /Applications/CRION.app`
          files: out/*
