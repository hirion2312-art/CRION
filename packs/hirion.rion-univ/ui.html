<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리온대학교 x스학과 · 신입생 폰 미리보기</title>
<style>
  :root { --accent: #e6c883; --pill: #e6c883; --bg: #0b1022; --text: #f1ede4; --sub: #a3a7ad; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 90% at 30% 0%, #1b2a5c, var(--bg) 60%); color: var(--text); font-family: 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; }
  .wrap { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 16px 18px; }
  header b { font-size: 17px; letter-spacing: .02em; }
  header span { display: block; font-size: 12.5px; color: var(--sub); }
  .stage { position: relative; min-height: 0; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(230,200,131,.45), 0 18px 40px rgba(0,0,0,.45); background: #0b0b0c; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .6s ease; }
  .stage img.on { opacity: 1; }
  .cap { position: absolute; left: 14px; bottom: 14px; max-width: 70%; padding: 10px 14px; border-radius: 12px; background: rgba(239,230,203,.96); color: #1d1c1a; font-size: 13.5px; line-height: 1.6; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .cap b { display: block; font-size: 15px; margin-bottom: 2px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  nav button { font: inherit; font-size: 13px; font-weight: 700; color: var(--text); padding: 7px 14px; border-radius: 999px; border: 0; cursor: pointer; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(230,200,131,.45); }
  nav button.on { color: #1a1a2e; background: var(--pill); box-shadow: none; }
  .note { text-align: center; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header><b>리온대학교 신입생 폰 · 개발자 테스트판</b><span>예시 장면이에요. 실제 플레이에서는 크랙 응답을 읽어 이렇게 보여 줘요. 배경 그림은 크랙 응답에 나온 그림이 들어가요.</span></header>
  <div class="stage" id="stage"></div>
  <div><nav id="nav"></nav><p class="note">폰·검사 버튼은 입력칸에 글만 채워요 · 보내기는 직접 · 언제든 크랙 화면으로 돌아갈 수 있어요</p></div>
</div>
<script>
  var S = [
    ['store/shot1.webp', '캠퍼스 무대', '응답 배경 그림이 꽉 차고, 말하는 사람 그림과 이름표 대사창. 위에는 주차·장소·등급·다음 일정, 오른쪽은 신입생 폰.'],
    ['store/shot2.webp', '시간표 · 학점', '상태창의 과제 평가를 모아 과목별 학점과 예상 평점(장학금 4.2)을 보여 줘요. 수강신청 문장도 만들어 줘요.'],
    ['store/shot3.webp', '입학 검사소', '신체·이론·상황 판단·면접을 앱 안에서 보고, 합격 통지서의 결과서를 입력칸에 채워 줘요.'],
    ['store/shot4.webp', '인연', '만난 히로인의 호감도 이모지·수치·변화. 말 걸기·가가오톡 보내기 문장을 채워 줘요.']
  ];
  var stage = document.getElementById('stage'), nav = document.getElementById('nav'), i = 0, imgs = [], cap = document.createElement('div');
  cap.className = 'cap';
  S.forEach(function (s, k) {
    var im = document.createElement('img'); im.src = s[0]; im.alt = s[1]; stage.appendChild(im); imgs.push(im);
    var b = document.createElement('button'); b.textContent = s[1]; b.onclick = function () { show(k); clearInterval(t); }; nav.appendChild(b);
  });
  stage.appendChild(cap);
  function show(k) { i = k; imgs.forEach(function (m, j) { m.className = j === k ? 'on' : ''; }); [].forEach.call(nav.children, function (b, j) { b.className = j === k ? 'on' : ''; }); cap.innerHTML = '<b>' + S[k][1] + '</b>' + S[k][2]; }
  show(0);
  var t = setInterval(function () { show((i + 1) % S.length); }, 5000);
</script>
</body>
</html>
